server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/resource_management
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=resource_admin
spring.datasource.password=resource1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:selim-resource-management-system-secret-key-2024-very-long-key-do-not-use-in-production}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
